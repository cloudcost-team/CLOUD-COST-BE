name: CloudCost CI 파이프라인

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "main" ]
  # dev 푸시는 CD 파이프라인이 이 워크플로를 먼저 호출한다
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 실제 AWS를 호출하지 않는다 (H2 + fake AWS 어댑터)
      - name: Run Tests
        run: ./gradlew test

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
