# 운영(EC2) 구성: Caddy(HTTPS 자동) → CloudCost 앱 → PostgreSQL
# 프로젝트 이름을 고정해 다른 Compose 프로젝트와 섞이지 않게 한다.
name: cloudcost-insight-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다}
      POSTGRES_DB: cci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 서버 내부(127.0.0.1)에서만 열린다. 인터넷에는 열리지 않고, DB 도구는 SSH 터널로만 접속한다 (docs/DEPLOY.md 9절).
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/cci
      DB_USERNAME: cci
      # AWS 자격증명은 EC2 인스턴스 역할(IAM Role)에서 자동으로 받는다. 액세스 키를 넣지 않는다.
      AWS_REGION: ap-northeast-2
    # 서버 내부(127.0.0.1)에서만 열린다. 인터넷에는 열리지 않고, SSH 터널로 확인할 때만 쓴다 (docs/DEPLOY.md 8절).
    ports:
      - "127.0.0.1:8080:8080"
      # 모니터링 지표(/actuator/prometheus). 서버 내부에서만 열리고 Alloy만 읽는다.
      - "127.0.0.1:8081:8081"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN이 필요합니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # 접근 로그를 서버 디스크에 남겨 서버 감시(sentinel)가 읽는다 (docs/DEPLOY.md 9-2)
      - ./logs/caddy:/var/log/caddy
      - caddy_config:/config

  # 모니터링 에이전트 (Grafana Cloud로 전송). .env에 COMPOSE_PROFILES=monitoring과 Grafana Cloud 값이 있을 때만 실행된다.
  # 서버 네트워크·프로세스 공간을 그대로 봐야 VM 지표가 정확해서 host 네트워크로 실행한다 (들어오는 포트는 열지 않음).
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["monitoring"]
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
  pgdata:
  caddy_data:
  caddy_config:
