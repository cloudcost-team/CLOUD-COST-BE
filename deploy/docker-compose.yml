# 운영(EC2) 구성: Caddy(HTTPS 자동) → CloudCost 앱 → PostgreSQL
# 프로젝트 이름을 고정해 다른 Compose 프로젝트와 섞이지 않게 한다.
name: cloudcost-insight-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다}
      POSTGRES_DB: cci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 서버 내부(127.0.0.1)에서만 열린다. 인터넷에는 열리지 않고, DB 도구는 SSH 터널로만 접속한다 (docs/DEPLOY.md 9절).
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/cci
      DB_USERNAME: cci
      # AWS 자격증명은 EC2 인스턴스 역할(IAM Role)에서 자동으로 받는다. 액세스 키를 넣지 않는다.
      AWS_REGION: ap-northeast-2
    # 서버 내부(127.0.0.1)에서만 열린다. 인터넷에는 열리지 않고, SSH 터널로 확인할 때만 쓴다 (docs/DEPLOY.md 8절).
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN이 필요합니다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
