<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudCost Insight 로그인</title>
  <!-- 간이 테스트 페이지: Google 로그인 → AWS 원클릭 연결 → 이번 달 사용량 확인. 토큰은 이 탭의 메모리에만 둔다. 프론트가 붙으면 그쪽 화면으로 대체한다. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5b6475; --line: #dfe3ea; --accent: #2563eb; --ok: #15803d; --warn: #b45309; --err: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --card: #1a1f26; --text: #e7ebf0; --muted: #9aa4b2; --line: #2b323c; --accent: #6ea0ff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    ul.facts { margin: 0 0 24px; padding: 0; list-style: none; }
    ul.facts li { padding: 4px 0; }
    ul.facts li::before { content: "✔ "; color: var(--ok); }
    ul.facts li.no::before { content: "✘ "; color: var(--err); }
    #button { min-height: 44px; }
    .status { margin-top: 12px; color: var(--muted); }
    .status.err { color: var(--err); }
    .status.ok { color: var(--ok); }
    #result, #aws { display: none; }
    #result { margin-top: 20px; }
    textarea { width: 100%; height: 90px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
    button, a.btn { display: inline-block; margin-top: 8px; margin-right: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; font: inherit; font-size: 14px; }
    button.secondary, a.btn.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    a.btn.big { font-size: 16px; padding: 12px 18px; }
    input[type=text] { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    button.danger { background: transparent; color: var(--err); border-color: var(--err); }
    .title { font-weight: 600; }
    select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    ol.steps { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: none; }
    .grow { flex: 1; min-width: 180px; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
    .badge.ACTIVE { color: var(--ok); } .badge.PENDING { color: var(--warn); } .badge.ERROR, .badge.DISCONNECTED { color: var(--err); }
    .muted { color: var(--muted); font-size: 13px; }
    .big-num { font-size: 28px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
    td.num, th.num { text-align: right; }
    #connectBox, #costs { display: none; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>CloudCost Insight</h1>
    <p class="sub">Google 계정으로 시작하세요.</p>
    <ul class="facts">
      <li>이메일과 이름만 받습니다</li>
      <li class="no">AWS 비밀번호·키는 받지 않습니다 (보기만 합니다)</li>
    </ul>
    <div id="button"></div>
    <div id="status" class="status">로그인 설정을 불러오는 중…</div>
    <div id="result">
      <div>로그인됨: <strong id="who"></strong> <span id="newUser"></span></div>
      <details style="margin-top:8px">
        <summary class="muted">개발자용 (<span id="exp"></span>까지)</summary>
        <textarea id="token" readonly></textarea>
        <button id="copy">토큰 복사</button>
        <a class="btn secondary" href="/swagger-ui.html" target="_blank" rel="noopener">Swagger 열기</a>
      </details>
    </div>
  </div>

  <div class="card" id="aws">
    <h2>AWS 연결</h2>
    <p class="sub">내 AWS 비용을 보려면 계정을 연결하세요.</p>
    <div id="accounts"></div>
    <div id="accountsStatus" class="status"></div>
    <div style="margin-top:12px">
      <input type="text" id="alias" maxlength="40" placeholder="이름 (예: 개인 계정)" aria-label="연결 이름">
      <select id="region" aria-label="지역">
        <option value="ap-northeast-2">서울</option>
        <option value="ap-northeast-1">도쿄</option>
        <option value="us-east-1">버지니아 북부</option>
        <option value="us-west-2">오레곤</option>
      </select>
      <button id="connect">연결하기</button>
    </div>
    <div id="connectBox">
      <a class="btn big" id="quickLink" target="_blank" rel="noopener">AWS에서 연결하기 ↗</a>
      <ol class="steps">
        <li>위 버튼을 누르고 AWS에 로그인합니다.</li>
        <li>맨 아래 <b>체크박스</b>를 누르고 <b>[스택 생성]</b>을 누릅니다.</li>
        <li>이 화면으로 돌아와 1~2분 기다립니다.</li>
      </ol>
      <div id="connectStatus" class="status"></div>
      <button id="cancelConnect" class="danger" style="display:none">취소</button>
    </div>
    <div id="costs"></div>
  </div>
</main>
<script>
  let accessToken = null;
  let pollTimer = null;
  let connectingId = null;
  const $ = id => document.getElementById(id);
  const STATUS_TEXT = { PENDING: '연결 중', ACTIVE: '연결됨', ERROR: '문제 있음', DISCONNECTED: '끊김' };
  const nameOf = a => a.alias || '이름 없는 연결';

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => k === 'class' ? node.className = v : node.setAttribute(k, v));
    children.forEach(c => node.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
    return node;
  }

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken, ...(options.headers || {}) }
    });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (res.status === 401) throw new Error('로그인이 만료되었습니다. 페이지를 새로고침해 다시 로그인하세요.');
    if (!res.ok) throw new Error((body && body.error && body.error.message) || `요청 실패 (${res.status})`);
    return body;
  }

  async function onCredential(response) {
    const status = $('status');
    setStatus(status, '확인 중…');
    try {
      const res = await fetch('/api/v1/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential })
      });
      const body = await res.json();
      if (!res.ok) {
        setStatus(status, (body.error && body.error.message) || '로그인에 실패했습니다.', 'err');
        return;
      }
      accessToken = body.accessToken;
      $('who').textContent = body.user.email || body.user.id;
      $('newUser').textContent = body.newUser ? '(새로 가입됨)' : '';
      $('exp').textContent = new Date(body.expiresAt).toLocaleString();
      $('token').value = body.accessToken;
      $('result').style.display = 'block';
      $('button').style.display = 'none';
      setStatus(status, '');
      $('aws').style.display = 'block';
      loadAccounts();
    } catch (e) {
      setStatus(status, '서버에 연결하지 못했습니다.', 'err');
    }
  }

  async function loadAccounts() {
    const box = $('accounts');
    try {
      // 연결 진행 중(PENDING)인 것은 아래 연결 상자에서만 보여 준다. 오래된 PENDING은 서버가 이미 뺀다.
      const accounts = (await api('/api/v1/aws/accounts')).filter(a => a.status !== 'PENDING');
      box.replaceChildren();
      if (!accounts.length) {
        box.append(el('p', { class: 'muted' }, '아직 연결한 계정이 없습니다.'));
        return;
      }
      accounts.forEach(a => box.append(accountRow(a)));
    } catch (e) {
      box.replaceChildren(el('p', { class: 'status err' }, e.message));
    }
  }

  function accountRow(a) {
    const title = el('div', { class: 'title' }, nameOf(a));
    const meta = el('div', { class: 'muted' },
      el('span', { class: 'badge ' + a.status }, STATUS_TEXT[a.status] || a.status), ' ', a.regionLabel || a.region);
    if (a.status === 'DISCONNECTED') meta.append(' · AWS에서 연결을 끊었습니다');
    const info = el('div', { class: 'grow' }, title, meta);
    if (a.lastError && (a.status === 'ERROR' || a.status === 'DISCONNECTED')) {
      info.append(el('div', { class: 'status err' }, a.lastError.message));
    }
    const row = el('div', { class: 'row' }, info);
    if (a.status === 'ACTIVE' || (a.status === 'ERROR' && a.verifiedAt)) {
      const btn = el('button', { class: 'secondary' }, '이번 달 비용');
      btn.addEventListener('click', () => loadCosts(a.accountId, btn));
      row.append(btn);
    }
    const renameBtn = el('button', { class: 'secondary' }, '이름 변경');
    renameBtn.addEventListener('click', () => startRename(a, title));
    const deleteBtn = el('button', { class: 'danger' }, '삭제');
    deleteBtn.addEventListener('click', () => deleteAccount(a, deleteBtn));
    row.append(renameBtn, deleteBtn);
    return row;
  }

  function startRename(a, title) {
    const input = el('input', { type: 'text', maxlength: '40', placeholder: '이름 없는 연결' });
    input.value = a.alias || '';
    const save = el('button', {}, '저장');
    const cancel = el('button', { class: 'secondary' }, '취소');
    const msg = el('div', { class: 'status' });
    const editor = el('div', {}, input, ' ', save, cancel, msg);
    title.replaceWith(editor);
    input.focus();
    cancel.addEventListener('click', () => editor.replaceWith(title));
    const submit = async () => {
      save.disabled = true;
      try {
        await api('/api/v1/aws/accounts/' + a.accountId, { method: 'PATCH', body: JSON.stringify({ alias: input.value }) });
        loadAccounts();
      } catch (e) {
        setStatus(msg, e.message, 'err');
        save.disabled = false;
      }
    };
    save.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') cancel.click(); });
  }

  async function deleteAccount(a, btn) {
    const verified = a.verifiedAt && a.status !== 'DISCONNECTED';
    const question = verified
      ? `'${nameOf(a)}'을(를) 삭제할까요?\n\n` +
        `AWS 쪽도 끊으려면 삭제 후 AWS 콘솔 → CloudFormation에서\n'${a.stackName}'을(를) 삭제하세요.`
      : `'${nameOf(a)}'을(를) 삭제할까요?`;
    if (!confirm(question)) return;
    btn.disabled = true;
    const status = $('accountsStatus');
    try {
      const result = await api('/api/v1/aws/accounts/' + a.accountId, { method: 'DELETE' });
      setStatus(status, result.message, result.awsCleanupNeeded ? '' : 'ok');
      $('costs').style.display = 'none';
      loadAccounts();
    } catch (e) {
      setStatus(status, e.message, 'err');
      btn.disabled = false;
    }
  }

  $('cancelConnect').addEventListener('click', async () => {
    if (!connectingId || !confirm('연결을 취소할까요?')) return;
    const status = $('connectStatus');
    try {
      const result = await api('/api/v1/aws/accounts/' + connectingId, { method: 'DELETE' });
      clearInterval(pollTimer);
      connectingId = null;
      $('quickLink').style.display = 'none';
      $('cancelConnect').style.display = 'none';
      setStatus(status, result.message, 'ok');
    } catch (e) {
      setStatus(status, e.message, 'err');
    }
  });

  $('connect').addEventListener('click', async () => {
    const btn = $('connect');
    const status = $('connectStatus');
    btn.disabled = true;
    $('connectBox').style.display = 'block';
    $('quickLink').style.display = 'none';
    setStatus(status, '연결을 준비하는 중…');
    try {
      const setup = await api('/api/v1/aws/accounts', {
        method: 'POST', body: JSON.stringify({ region: $('region').value, alias: $('alias').value })
      });
      connectingId = setup.account.accountId;
      $('cancelConnect').style.display = 'inline-block';
      const link = setup.roleSetup.quickCreateUrl;
      if (!link) {
        setStatus(status, (setup.roleSetup.warnings || []).join(' ') || '원클릭 링크를 만들지 못했습니다.', 'err');
        return;
      }
      $('quickLink').href = link;
      $('quickLink').style.display = 'inline-block';
      $('alias').value = '';
      setStatus(status, '기다리는 중…');
      poll(connectingId);
    } catch (e) {
      setStatus(status, e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  });

  function poll(accountId) {
    clearInterval(pollTimer);
    const status = $('connectStatus');
    const startedAt = Date.now();
    pollTimer = setInterval(async () => {
      try {
        const a = (await api('/api/v1/aws/accounts/' + accountId)).account;
        if (a.status === 'ACTIVE') {
          clearInterval(pollTimer);
          connectingId = null;
          $('cancelConnect').style.display = 'none';
          setStatus(status, `'${nameOf(a)}' 연결됐습니다.`, 'ok');
          loadAccounts();
        } else if (a.status === 'ERROR') {
          clearInterval(pollTimer);
          setStatus(status, (a.lastError && a.lastError.message) || '연결 확인에 실패했습니다.', 'err');
          loadAccounts();
        } else if (Date.now() - startedAt > 10 * 60 * 1000) {
          clearInterval(pollTimer);
          setStatus(status, '10분이 지나도 연결되지 않았습니다. 취소하고 다시 시도하세요.', 'err');
        } else {
          const sec = Math.round((Date.now() - startedAt) / 1000);
          setStatus(status, `기다리는 중… (${sec}초)`);
        }
      } catch (e) {
        clearInterval(pollTimer);
        setStatus(status, e.message, 'err');
      }
    }, 5000);
  }

  async function loadCosts(accountId, btn) {
    const box = $('costs');
    box.style.display = 'block';
    box.replaceChildren(el('p', { class: 'muted' }, '불러오는 중… (처음에는 몇 초 걸립니다)'));
    btn.disabled = true;
    try {
      const c = await api(`/api/v1/aws/accounts/${accountId}/costs`);
      const won = v => v == null ? '단가 없음' : Number(v).toLocaleString('ko-KR') + (c.currency === 'KRW' ? '원' : ' USD');
      const table = el('table', {},
        el('tr', {}, el('th', {}, '서버'), el('th', {}, '종류'), el('th', { class: 'num' }, '켜진 시간'), el('th', { class: 'num' }, '예상 비용')));
      c.instances.forEach(i => table.append(el('tr', {},
        el('td', {}, i.name || i.instanceId), el('td', { class: 'mono' }, i.instanceType),
        el('td', { class: 'num' }, i.usageHours + '시간'), el('td', { class: 'num' }, won(i.estimatedCost)))));
      box.replaceChildren(
        el('h2', {}, `${c.from} ~ ${c.to}`),
        el('div', { class: 'big-num' }, won(c.estimatedCost)),
        el('div', { class: 'muted' }, '예상 금액 (실제 청구서와 다를 수 있음)'),
        c.instances.length ? table : el('p', { class: 'muted' }, '이 기간에 켠 서버가 없습니다.'));
    } catch (e) {
      box.replaceChildren(el('p', { class: 'status err' }, e.message));
    } finally {
      btn.disabled = false;
    }
  }

  $('copy').addEventListener('click', async () => {
    const token = $('token');
    try {
      await navigator.clipboard.writeText(token.value);
    } catch (e) {
      token.select();
      document.execCommand('copy');
    }
    $('copy').textContent = '복사됨';
  });

  async function init() {
    const status = $('status');
    let config;
    try {
      config = await (await fetch('/api/v1/auth/config')).json();
    } catch (e) {
      setStatus(status, '서버에 연결하지 못했습니다.', 'err');
      return;
    }
    if (!config.googleClientId) {
      setStatus(status, '서버에 GOOGLE_CLIENT_ID가 설정되지 않았습니다 (관리자 설정 필요).', 'err');
      return;
    }
    const start = () => {
      if (!window.google || !google.accounts) { setTimeout(start, 100); return; }
      google.accounts.id.initialize({ client_id: config.googleClientId, callback: onCredential });
      google.accounts.id.renderButton($('button'),
        { theme: 'outline', size: 'large', text: 'continue_with', locale: 'ko', width: 300 });
      setStatus(status, '');
    };
    start();
  }
  init();
</script>
</body>
</html>
