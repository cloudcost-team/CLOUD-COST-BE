spring:
  application:
    name: cloudcost-insight
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cci}
    username: ${DB_USERNAME:cci}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # 스택 신호 폴링·예약 수집 워커·알림 발송이 서로 막지 않게 스레드를 나눈다 (ADR-019)
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${PORT:8080}

# 모니터링 지표는 별도 관리 포트로만 연다. 운영에서는 서버 내부(127.0.0.1)에만 매핑하고 Caddy로 노출하지 않는다.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: cloudcost-insight

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

cci:
  app-env: ${APP_ENV:local}
  # 프론트 출처 (쉼표 구분). Origin 헤더에는 끝 슬래시가 없으므로 붙이지 않는다
  cors:
    allowed-origins: ${CCI_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://www.cloud-cost.cloud,https://cloud-cost.cloud}
  auth:
    mode: ${AUTH_MODE:dev}
    dev-default-owner: ${DEV_OWNER_ID:local-dev-user}
    # Google 로그인 (docs/decisions/004). 클라이언트 ID는 공개 값, JWT_SECRET은 비밀 (32바이트 이상)
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # 인가 코드(OAuth 팝업) 로그인에서 코드를 교환할 때만 쓴다. 비밀 값 — 환경변수로만 넣는다 (ADR-018)
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 1h
    # 리프레시 토큰: HttpOnly 쿠키(cci_refresh, Path=/api/v1/auth, SameSite=Lax). ADR-017
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  aws:
    # 고객 Trust Policy의 Principal. 실제 값은 환경변수로만 넣는다 (예시: arn:aws:iam::111122223333:role/CloudCostInsightBackendRole)
    backend-role-arn: ${CCI_BACKEND_ROLE_ARN:}
    # 빠른 생성 링크 + 스택 신호 (docs/AWS_SETUP_GUIDE.md 3절, 관리자가 1번 준비)
    template-url: ${CCI_TEMPLATE_URL:}
    callback-topic-arn: ${CCI_CALLBACK_TOPIC_ARN:}
    callback-queue-url: ${CCI_CALLBACK_QUEUE_URL:}
    # 예약 수집 작업 큐 (DLQ 재전송 정책 maxReceiveCount=3). 비어 있으면 예약 수집을 켜지 않는다 (ADR-019)
    collection-queue-url: ${CCI_COLLECTION_QUEUE_URL:}
    verify-attempts: 6
    verify-interval: 10s
    assume-role-duration-seconds: 900
    pricing-region: us-east-1
  # 체험 모드 간이 로그인 (실제 AWS 계정 아님, 화면에 안내하는 공개 값. docs/decisions/008)
  demo:
    username: ${CCI_DEMO_USERNAME:cloudcost}
    password: ${CCI_DEMO_PASSWORD:1234}
  # 팀 벤치마킹 비교 기준 파일 (docs/decisions/013). 바꾸려면 file:/경로/reference.json
  benchmark:
    reference: ${CCI_BENCHMARK_REFERENCE:classpath:benchmark/reference.json}
  # 예약 수집 시각 (KST, cci.usage.zone). 기본 하루 4번 03·09·15·21시
  collection:
    cron: ${CCI_COLLECTION_CRON:0 0 3,9,15,21 * * *}
  # 외부 알림 발송 (Discord 웹훅, ADR-019)
  notification:
    dispatch-enabled: ${CCI_NOTIFY_DISPATCH_ENABLED:true}
    dispatch-interval: 60s
    app-url: ${CCI_APP_URL:https://www.cloud-cost.cloud}
  usage:
    instance-ttl: ${CCI_INSTANCE_TTL:10m}
    usage-ttl: ${CCI_USAGE_TTL:1h}
    backfill: ${CCI_USAGE_BACKFILL:90d}
    overlap: 2h
    max-cw-requests-per-refresh: ${CCI_MAX_CW_REQUESTS:500}
    zone: Asia/Seoul
    price-ttl: 7d
    missing-price-ttl: 1d

# 자격증명·요청 원문이 남지 않도록 AWS SDK 와이어/인증 로그는 DEBUG로 켜지 않는다 (docs/SECURITY.md)
logging:
  level:
    root: INFO
    software.amazon.awssdk: WARN
    software.amazon.awssdk.request: WARN
    software.amazon.awssdk.auth: WARN
    org.apache.http.wire: OFF
    org.apache.http.headers: OFF
